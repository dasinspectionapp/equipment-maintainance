services:
  backend-prod:
    build:
      context: ./server
    container_name: backend-prod
    restart: always
    volumes:
      # Named volume keeps uploads out of the Jenkins workspace (see docker-compose.staging.yml).
      - dasequipment_prod_uploads:/app/uploads
      # NEVER mount the whole /app/config dir — it hides db.js, firebaseAdmin.js, etc. from the image.
      # Mount only the Firebase JSON key; app code in /app/config stays from the Docker image.
      - ${DAS_PROD_SERVICE_ACCOUNT:-./server/config/serviceAccountKey.json}:/app/config/serviceAccountKey.json:ro
    # Try without host network - use bridge network like other containers that work
    # network_mode: "host"  # Commented out - try bridge network instead
    environment:
      # Use IP address and 'das' database (like staging) - users are stored in 'das' database
      MONGODB_URI: mongodb://admin:password@192.168.29.14:27017/das?authSource=admin&authMechanism=SCRAM-SHA-256
      PORT: 5001
      NODE_ENV: production
      JWT_SECRET: bescom_distribution_automation_system_secret_key_2024
      JWT_EXPIRE: 7d
      FRONTEND_URL: https://bescomdas.vcaan.in
    ports:
      - "0.0.0.0:5001:5001"
    # Note: When using host network mode, ports are automatically exposed
    # No need to map ports separately
    # Use 127.0.0.1 — localhost can resolve to ::1 while the app listens on IPv4 only, so curl fails.
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s --max-time 5 http://127.0.0.1:5001/health > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 240s

  frontend-prod:
    image: nginx:latest
    container_name: frontend-prod
    restart: always
    ports:
      - "0.0.0.0:4003:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-prod:
        condition: service_healthy

volumes:
  dasequipment_prod_uploads:
