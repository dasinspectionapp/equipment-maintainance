services:
  backend-staging:
    build:
      context: ./server
    container_name: backend-staging
    restart: always
    volumes:
      # Named volume keeps uploads out of the Jenkins workspace so Git checkout can wipe the job directory
      # (bind-mount ./server/uploads caused root-owned files and "Failed to delete workspace").
      - dasequipment_staging_uploads:/app/uploads
    environment:
      MONGODB_URI: mongodb://admin:password@192.168.29.14:27017/das?authSource=admin&authMechanism=SCRAM-SHA-256
      PORT: 4000
      NODE_ENV: staging
      JWT_SECRET: bescom_distribution_automation_system_secret_key_2024
      JWT_EXPIRE: 7d
      FRONTEND_URL: http://192.168.29.14:4001
    ports:
      - "4000:4000"

  frontend-staging:
    image: nginx:latest
    container_name: frontend-staging
    restart: always
    ports:
      - "4001:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro

volumes:
  dasequipment_staging_uploads:
